services:
  vintage_story:
    image: neebz/vintage-story-server:2026.05.10-1-rc-16
    ports:
      - "42420:42420/tcp"
      - "42420:42420/udp"
    volumes:
      - ${GAME_FILES_LOCATION}:/app/server_files
      - ${GAME_FILES_LOCATION}:/app/game_files
    environment:
      VERSION: ${VERSION}
      CHANNEL: ${CHANNEL}
    user: 1000:1000